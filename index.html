<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Scheduler</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f4; --bg3: #efefed;
    --text: #1a1a18; --text2: #6b6b67; --text3: #9a9a94;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --radius: 8px; --radius-lg: 12px;
    --blue: #185FA5; --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --green: #3B6D11; --green-bg: #EAF3DE; --green-text: #27500A;
    --red: #A32D2D; --red-bg: #FCEBEB; --red-text: #791F1F;
    --amber: #854F0B; --amber-bg: #FAEEDA; --amber-text: #633806;
    --gray-bg: #F1EFE8; --gray-text: #5F5E5A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #242422; --bg3: #2c2c2a;
      --text: #f0efeb; --text2: #a0a09a; --text3: #6b6b65;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --blue-bg: #042C53; --blue-text: #85B7EB;
      --green-bg: #173404; --green-text: #C0DD97;
      --red-bg: #501313; --red-text: #F09595;
      --amber-bg: #412402; --amber-text: #FAC775;
      --gray-bg: #2C2C2A; --gray-text: #B4B2A9;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: var(--text); background: var(--bg3); min-height: 100vh; }

  /* App shell */
  .app { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg3); }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--bg); border-bottom: 0.5px solid var(--border); gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 50; }
  .topbar-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text); white-space: nowrap; }
  .topbar-title i { color: var(--blue); font-size: 20px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gs-input { font-size: 12px; padding: 6px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); width: 260px; }
  .gs-input:focus { outline: none; border-color: var(--blue); }
  .status-indicator { display: flex; align-items: center; gap: 5px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .status-dot.connected { background: #639922; }
  .status-dot.error { background: #E24B4A; }
  .status-label { font-size: 11px; color: var(--text2); white-space: nowrap; }

  /* Buttons */
  .btn { font-size: 12px; padding: 6px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: background 0.15s; font-family: inherit; }
  .btn:hover { background: var(--bg2); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-primary:hover { background: var(--blue-text); }
  .btn-success { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-success:hover { background: var(--green-text); }
  .btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-danger:hover { background: var(--red-text); }
  .btn-sm { font-size: 11px; padding: 4px 9px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Tabs */
  .tabs { display: flex; background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 0 20px; gap: 2px; overflow-x: auto; }
  .tab { padding: 11px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text2); white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: color 0.15s; user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }
  .tab-badge { font-size: 10px; background: var(--bg2); border-radius: 9px; padding: 1px 6px; color: var(--text2); }
  .tab.active .tab-badge { background: var(--blue-bg); color: var(--blue); }

  /* Content */
  .content { flex: 1; padding: 20px; max-width: 1200px; width: 100%; margin: 0 auto; }

  /* Cards */
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .card-title { font-size: 13px; font-weight: 500; }
  .card-subtitle { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* Table */
  .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 0.5px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { padding: 9px 12px; text-align: left; font-weight: 500; font-size: 11px; color: var(--text2); background: var(--bg2); border-bottom: 0.5px solid var(--border); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg2); }

  /* Badges */
  .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 9px; font-weight: 500; white-space: nowrap; }
  .badge-pending { background: var(--amber-bg); color: var(--amber-text); }
  .badge-passed { background: var(--green-bg); color: var(--green-text); }
  .badge-failed { background: var(--red-bg); color: var(--red-text); }
  .badge-scheduled { background: var(--blue-bg); color: var(--blue-text); }
  .badge-withdrawn { background: var(--gray-bg); color: var(--gray-text); }

  /* Round pips */
  .rounds-cell { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .round-pip { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 9px; font-weight: 600; border: 0.5px solid var(--border2); color: var(--text2); background: var(--bg2); cursor: pointer; position: relative; }
  .round-pip:hover::after { content: attr(data-tip); position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 10px; padding: 3px 7px; border-radius: 4px; white-space: nowrap; z-index: 10; pointer-events: none; }
  .round-pip.pass { background: var(--green-bg); color: var(--green-text); border-color: #97C459; }
  .round-pip.fail { background: var(--red-bg); color: var(--red-text); border-color: #F09595; }
  .round-pip.scheduled { background: var(--blue-bg); color: var(--blue-text); border-color: #85B7EB; }
  .add-pip { width: 22px; height: 22px; border-radius: 50%; border: 0.5px dashed var(--border2); background: none; cursor: pointer; color: var(--text3); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; }
  .add-pip:hover { border-color: var(--blue); color: var(--blue); }

  /* Current choice tag */
  .choice-tag { display: inline-flex; align-items: center; gap: 3px; background: var(--blue-bg); color: var(--blue-text); border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 500; }

  /* Form elements */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-group:last-child { margin-bottom: 0; }
  label { font-size: 11px; color: var(--text2); font-weight: 500; }
  input[type=text], input[type=date], input[type=time], input[type=number], input[type=email], select, textarea {
    padding: 7px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); }
  textarea { resize: vertical; min-height: 64px; }

  /* Choices */
  .choice-row { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .choice-num { font-size: 11px; color: var(--text2); font-weight: 500; min-width: 18px; text-align: right; }
  .choice-current-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  .choice-row select { flex: 1; }
  .btn-add-choice { background: none; border: none; font-size: 12px; color: var(--blue); cursor: pointer; padding: 2px 0; display: flex; align-items: center; gap: 4px; font-family: inherit; }
  .btn-add-choice:hover { text-decoration: underline; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border2); padding: 22px; width: 520px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-title { font-size: 15px; font-weight: 600; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 0.5px solid var(--border); }
  .close-btn { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 20px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .close-btn:hover { background: var(--bg2); color: var(--text); }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--bg2); border-radius: var(--radius); padding: 12px 14px; }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 5px; }
  .stat-value { font-size: 24px; font-weight: 600; line-height: 1; }
  .stat-value.blue { color: var(--blue); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.amber { color: var(--amber); }

  /* Charts */
  .chart-bar-wrap { display: flex; flex-direction: column; gap: 9px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .bar-label { width: 130px; color: var(--text2); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex-shrink: 0; font-size: 11px; }
  .bar-track { flex: 1; background: var(--bg2); border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding: 0 7px; font-size: 10px; font-weight: 500; color: #fff; transition: width 0.5s ease; min-width: 0; }
  .bar-count { width: 28px; text-align: right; font-size: 11px; color: var(--text2); flex-shrink: 0; }

  /* Donut */
  .donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 9px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Per-student progress bar */
  .progress-bar-wrap { display: flex; flex-direction: column; gap: 10px; }
  .progress-row { }
  .progress-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 4px; }
  .progress-track { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

  /* Search row */
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .search-input { padding: 7px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); font-size: 12px; flex: 1; min-width: 160px; font-family: inherit; }
  .search-input:focus { outline: none; border-color: var(--blue); }
  select.filter-sel { font-size: 12px; padding: 6px 8px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: inherit; }

  /* Empty state */
  .empty { text-align: center; padding: 48px 20px; color: var(--text3); }
  .empty i { font-size: 36px; display: block; margin-bottom: 10px; opacity: 0.4; }
  .empty p { font-size: 13px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; z-index: 999; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: none; max-width: 300px; line-height: 1.4; }
  .toast.show { display: block; }
  .toast.success { border-left: 3px solid #639922; }
  .toast.error { border-left: 3px solid #E24B4A; }
  .toast.info { border-left: 3px solid #378ADD; }

  /* Setup note */
  .setup-note { font-size: 12px; color: var(--blue-text); background: var(--blue-bg); border-left: 3px solid var(--blue); border-radius: 4px; padding: 10px 14px; margin-bottom: 16px; line-height: 1.7; }
  .setup-note code { background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 3px; font-size: 11px; }

  /* Grid 2 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) {
    .grid2 { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .form-row-3 { grid-template-columns: 1fr 1fr; }
    .gs-input { width: 180px; }
    .topbar { padding: 10px 14px; }
    .content { padding: 14px; }
  }

  /* Company tags */
  .companies-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; }
  .company-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12px; }
  .company-rm { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; line-height: 1; padding: 0; }
  .company-rm:hover { color: var(--red); }

  /* Separator */
  .sep { height: 0.5px; background: var(--border); margin: 14px 0; }

  /* Student card (students tab) */
  .student-card { border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: background 0.12s; }
  .student-card:hover { background: var(--bg2); }
  .student-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
  .student-card-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--text2); }
  .student-card-meta span { display: flex; align-items: center; gap: 4px; }

  /* Successful table highlight */
  .first-choice td:nth-child(4) { font-weight: 600; }
</style>
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-title">
      <i class="ti ti-calendar-event"></i>
      Interview Scheduler
    </div>
    <div class="topbar-right">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">Not connected</span>
      </div>
      <input class="gs-input" id="sheetId" placeholder="Paste Google Sheet ID or URL…">
      <button class="btn btn-primary" onclick="connectSheet()"><i class="ti ti-plug"></i> Connect</button>
      <button class="btn" onclick="syncSheet()" id="syncBtn" disabled><i class="ti ti-refresh"></i> Sync</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-schedule" onclick="switchTab('schedule')"><i class="ti ti-calendar"></i> Schedule <span class="tab-badge" id="badge-schedule">0</span></div>
    <div class="tab" id="tab-students" onclick="switchTab('students')"><i class="ti ti-users"></i> Students <span class="tab-badge" id="badge-students">0</span></div>
    <div class="tab" id="tab-progress" onclick="switchTab('progress')"><i class="ti ti-chart-bar"></i> Progress</div>
    <div class="tab" id="tab-successful" onclick="switchTab('successful')"><i class="ti ti-trophy"></i> Successful <span class="tab-badge" id="badge-successful">0</span></div>
    <div class="tab" id="tab-settings" onclick="switchTab('settings')"><i class="ti ti-settings"></i> Settings</div>
  </div>

  <!-- Main content -->
  <div class="content" id="content"></div>

</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
const state = {
  connected: false,
  sheetId: '',
  apiKey: '',
  sheetTab: 'Students',
  currentTab: 'schedule',
  maxRounds: 3,
  companies: ['TechCorp', 'Innovate Ltd', 'DataSystems', 'CloudBase', 'NexGen'],
  students: [
    { id:'S001', name:'Alice Tan', slot:'2024-03-10 09:00', choices:['TechCorp','Innovate Ltd','DataSystems'], currentChoiceIdx:0, rounds:[{status:'pass',date:'2024-03-10',notes:'Strong performance'},{status:'pass',date:'2024-03-17',notes:''},{status:'pass',date:'2024-03-24',notes:'Excellent final round'}], remarks:'Top candidate' },
    { id:'S002', name:'Ben Lim', slot:'2024-03-10 10:00', choices:['CloudBase','TechCorp','NexGen'], currentChoiceIdx:1, rounds:[{status:'fail',date:'2024-03-10',notes:'Lacked technical depth'},{status:'scheduled',date:'2024-03-17',notes:''}], remarks:'' },
    { id:'S003', name:'Cara Ng', slot:'2024-03-11 09:00', choices:['NexGen','DataSystems','Innovate Ltd'], currentChoiceIdx:0, rounds:[], remarks:'Scholarship student' },
    { id:'S004', name:'David Oh', slot:'2024-03-11 11:00', choices:['Innovate Ltd','CloudBase'], currentChoiceIdx:2, rounds:[{status:'fail',date:'2024-03-11',notes:''},{status:'fail',date:'2024-03-18',notes:'Did not improve'}], remarks:'' },
    { id:'S005', name:'Eva Chen', slot:'2024-03-12 09:00', choices:['DataSystems','NexGen','TechCorp'], currentChoiceIdx:0, rounds:[{status:'pass',date:'2024-03-12',notes:''},{status:'pass',date:'2024-03-19',notes:''},{status:'pass',date:'2024-03-26',notes:''}], remarks:'' },
  ],
  // UI filters
  _schedSearch: '',
  _schedFilt: 'all',
};

// ═══════════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
function getStatus(s) {
  if (!s.rounds.length) return 'pending';
  const last = s.rounds[s.rounds.length - 1];
  if (isSuccessful(s)) return 'passed';
  if (last.status === 'fail' && s.currentChoiceIdx >= s.choices.length) return 'withdrawn';
  if (last.status === 'fail') return 'failed';
  if (last.status === 'scheduled') return 'scheduled';
  return 'pending';
}

function isSuccessful(s) {
  if (!s.rounds.length) return false;
  const needed = state.maxRounds > 0 ? state.maxRounds : s.rounds.length;
  return s.rounds.length >= needed && s.rounds.slice(-needed).every(r => r.status === 'pass');
}

function getCurrentCompany(s) {
  return s.choices[s.currentChoiceIdx] || '—';
}

function statusBadge(st) {
  const map = { pending:'badge-pending', passed:'badge-passed', failed:'badge-failed', scheduled:'badge-scheduled', withdrawn:'badge-withdrawn' };
  return `<span class="badge ${map[st]||'badge-pending'}">${st}</span>`;
}

function roundPip(r, i) {
  const cls = r.status === 'pass' ? 'pass' : r.status === 'fail' ? 'fail' : 'scheduled';
  const tip = `Round ${i+1}: ${r.status}${r.date?' ('+r.date+')':''}${r.notes?' — '+r.notes:''}`;
  return `<span class="round-pip ${cls}" data-tip="${tip.replace(/"/g,"'")}">${i+1}</span>`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════════════════════════
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  updateBadges();
  renderContent();
}

function updateBadges() {
  document.getElementById('badge-schedule').textContent = state.students.length;
  document.getElementById('badge-students').textContent = state.students.length;
  document.getElementById('badge-successful').textContent = state.students.filter(s => isSuccessful(s)).length;
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER DISPATCHER
// ═══════════════════════════════════════════════════════════════════════════════
function renderContent() {
  const el = document.getElementById('content');
  const map = { schedule: renderSchedule, students: renderStudents, progress: renderProgress, successful: renderSuccessful, settings: renderSettings };
  el.innerHTML = (map[state.currentTab] || renderSchedule)();
}

// ═══════════════════════════════════════════════════════════════════════════════
// TAB: SCHEDULE
// ═══════════════════════════════════════════════════════════════════════════════
function renderSchedule() {
  const search = state._schedSearch;
  const filt = state._schedFilt;
  const rows = state.students.filter(s => {
    const st = getStatus(s);
    if (search && !s.name.toLowerCase().includes(search) && !s.id.toLowerCase().includes(search)) return false;
    if (filt !== 'all' && st !== filt) return false;
    return true;
  });

  return `
  <div class="search-row">
    <input class="search-input" placeholder="Search by name or student ID…" oninput="state._schedSearch=this.value.toLowerCase();renderContent()" value="${escHtml(state._schedSearch)}">

// ═══════════════════════════════════════════════════════════════════════════════
// TAB: PROGRESS
// ═══════════════════════════════════════════════════════════════════════════════
function renderProgress() {
  const total = state.students.length || 1;
  const passed = state.students.filter(s=>isSuccessful(s)).length;
  const withdrawn = state.students.filter(s=>getStatus(s)==='withdrawn').length;
  const inProg = state.students.filter(s=>['pending','scheduled','failed'].includes(getStatus(s))).length;
  const passRate = Math.round(passed/total*100);
  const avgRounds = state.students.length ? (state.students.reduce((a,s)=>a+s.rounds.length,0)/state.students.length).toFixed(1) : 0;

  // Donut SVG
  const cx=60,cy=60,r=48,circ=2*Math.PI*r;
  function arc(pct,offset,color) {
    const dash=(pct/100)*circ,gap=circ-dash;
    const rot=(offset/100)*360-90;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" transform="rotate(${rot} ${cx} ${cy})"/>`;
  }
  const pPct=Math.round(passed/total*100),iPct=Math.round(inProg/total*100),wPct=100-pPct-iPct;
  const donut=`<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e8e8e6" stroke-width="14"/>
    ${arc(pPct,0,'#639922')}
    ${arc(iPct,pPct,'#378ADD')}
    ${arc(Math.max(0,wPct),pPct+iPct,'#E24B4A')}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">${passRate}%</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="10" fill="#888">pass rate</text>
  </svg>`;

  // By company
  const byCompany = {};
  state.companies.forEach(c=>byCompany[c]={pass:0,fail:0,total:0});
  state.students.forEach(s=>{
    const c=getCurrentCompany(s);
    if(!byCompany[c]) byCompany[c]={pass:0,fail:0,total:0};
    byCompany[c].total++;
    s.rounds.forEach(r=>{ if(r.status==='pass') byCompany[c].pass++; else if(r.status==='fail') byCompany[c].fail++; });
  });
  const compEntries = Object.entries(byCompany).filter(([,v])=>v.total>0).sort((a,b)=>b[1].total-a[1].total);

  // Rounds distribution
  const maxR = Math.max(...state.students.map(s=>s.rounds.length),state.maxRounds,1);
  const roundBuckets = {};
  for(let i=0;i<=maxR;i++) roundBuckets[i]=0;
  state.students.forEach(s=>{ roundBuckets[s.rounds.length]=(roundBuckets[s.rounds.length]||0)+1; });

  return `
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Pass rate</div><div class="stat-value green">${passRate}%</div></div>
    <div class="stat-card"><div class="stat-label">Avg rounds</div><div class="stat-value blue">${avgRounds}</div></div>
    <div class="stat-card"><div class="stat-label">Successful</div><div class="stat-value green">${passed}</div></div>
    <div class="stat-card"><div class="stat-label">In progress</div><div class="stat-value amber">${inProg}</div></div>
    <div class="stat-card"><div class="stat-label">Withdrawn</div><div class="stat-value red">${withdrawn}</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-header"><div class="card-title">Outcome overview</div></div>
      <div class="donut-wrap">
        ${donut}
        <div class="donut-legend">
          <div class="legend-item"><span class="legend-dot" style="background:#639922"></span>Successful (${passed})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#378ADD"></span>In progress (${inProg})</div>
          <div class="legend-item"><span class="legend-dot" style="background:#E24B4A"></span>Withdrawn (${withdrawn})</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">Rounds distribution</div></div>
      <div class="chart-bar-wrap">
        ${Object.entries(roundBuckets).filter(([k,v])=>v>0||parseInt(k)<=state.maxRounds).map(([k,v])=>{
          const pct=Math.round(v/total*100);
          return `<div class="bar-row">
            <span class="bar-label">${parseInt(k)===0?'Not started':k+' round'+(k!=='1'?'s':'')}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#378ADD">${v>0?v:''}</div></div>
            <span class="bar-count">${v}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title">Interview volume by company</div></div>
    <div class="chart-bar-wrap">
      ${compEntries.length ? compEntries.map(([co,v])=>{
        const pct=Math.round(v.total/state.students.length*100)||0;
        const label=`${v.pass}✓ ${v.fail}✗`;
        return `<div class="bar-row">
          <span class="bar-label" title="${escHtml(co)}">${escHtml(co)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#185FA5">${pct>15?label:''}</div></div>
          <span class="bar-count">${v.total}</span>
        </div>`;
      }).join('') : '<p style="font-size:12px;color:var(--text2)">No data yet.</p>'}
    </div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title">Per-student interview progress</div></div>
    <div class="progress-bar-wrap">
      ${state.students.map(s=>{
        const st=getStatus(s);
        const maxR2=state.maxRounds>0?state.maxRounds:Math.max(s.rounds.length,1);
        const pct=Math.round(Math.min(s.rounds.length/maxR2,1)*100);
        const color=st==='passed'?'#639922':st==='withdrawn'?'#E24B4A':'#378ADD';
        return `<div class="progress-row">
          <div class="progress-meta">
            <span>${escHtml(s.name)} <span style="font-size:10px;color:var(--text2);font-family:monospace">${escHtml(s.id)}</span></span>
            <div style="display:flex;gap:5px;align-items:center">${s.rounds.map((r,i)=>roundPip(r,i)).join('')} ${statusBadge(st)}</div>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderSuccessful() {

  const at1st = success.filter(s=>s.currentChoiceIdx===0).length;
  const avgR = (success.reduce((a,s)=>a+s.rounds.length,0)/success.length).toFixed(1);

  return `
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total successful</div><div class="stat-value green">${success.length}</div></div>
    <div class="stat-card"><div class="stat-label">Placed at 1st choice</div><div class="stat-value blue">${at1st}</div></div>
    <div class="stat-card"><div class="stat-label">At 2nd+ choice</div><div class="stat-value amber">${success.length-at1st}</div></div>
    <div class="stat-card"><div class="stat-label">Avg rounds</div><div class="stat-value blue">${avgR}</div></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Placed At</th><th>Choice #</th><th>Interview Slot</th><th>Rounds</th><th>Remarks</th></tr></thead>
      <tbody>
      ${success.map(s=>`<tr class="${s.currentChoiceIdx===0?'first-choice':''}">
        <td style="font-family:monospace;font-size:11px;color:var(--text2)">${escHtml(s.id)}</td>
        <td style="font-weight:500">${escHtml(s.name)}</td>
        <td><span class="choice-tag"><i class="ti ti-building" style="font-size:12px"></i>${escHtml(getCurrentCompany(s))}</span></td>
        <td style="text-align:center">${s.currentChoiceIdx===0?`<span class="badge badge-passed">1st choice ★</span>`:`<span class="badge badge-scheduled">Choice #${s.currentChoiceIdx+1}</span>`}</td>
        <td style="font-size:11px;color:var(--text2)">${escHtml(s.slot)||'—'}</td>
        <td><div class="rounds-cell">${s.rounds.map((r,i)=>roundPip(r,i)).join('')}</div></td>
        <td style="font-size:11px;color:var(--text2)">${escHtml(s.remarks)||'—'}</td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

// STUDENT MODAL (Add / Edit)
// ═══════════════════════════════════════════════════════════════════════════════
function openStudentModal(id) {
  const isEdit = id !== null;
  const s = isEdit ? state.students.find(st=>st.id===id) : null;
  if (isEdit && !s) return;
  const def = s || { id:'', name:'', slot:'', choices:['','',''], currentChoiceIdx:0, rounds:[], remarks:'' };

  const choiceOptions = state.companies.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
  const numChoices = Math.max(def.choices.length, 3);

  function choiceRow(i) {
    const val = def.choices[i] || '';
    const isCurrent = i === def.currentChoiceIdx;
    return `<div class="choice-row" id="cr_${i}">
      <span class="choice-num">${i+1}.</span>
      ${isCurrent ? '<span class="choice-current-dot" title="Current active choice"></span>' : '<span style="width:6px"></span>'}
      <select id="choice_${i}">
        <option value="">— none —</option>
        ${state.companies.map(c=>`<option value="${escHtml(c)}"${c===val?' selected':''}>${escHtml(c)}</option>`).join('')}
      </select>
    </div>`;
  }

  const datePart = def.slot ? def.slot.split(' ')[0] : '';
  const timePart = def.slot && def.slot.includes(' ') ? def.slot.split(' ')[1] : '';

  const html = `<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target.id==='modalBackdrop')closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">${isEdit ? 'Edit student' : 'Add new student'}</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="form-row">
      <div class="form-group"><label>Student ID *</label><input type="text" id="m_id" value="${escHtml(def.id)}" placeholder="S001" ${isEdit?'readonly style="opacity:0.6"':''}></div>
      <div class="form-group"><label>Full name *</label><input type="text" id="m_name" value="${escHtml(def.name)}" placeholder="Full name"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Interview date</label><input type="date" id="m_date" value="${escHtml(datePart)}"></div>
      <div class="form-group"><label>Time</label><input type="time" id="m_time" value="${escHtml(timePart)}"></div>
    </div>

    <div class="sep"></div>
    <div style="font-size:13px;font-weight:500;margin-bottom:4px">Company choices</div>
    <p style="font-size:11px;color:var(--text2);margin-bottom:10px">The system will automatically advance to the next choice when a student fails.</p>
    <div id="choicesList">${Array.from({length:numChoices},(_,i)=>choiceRow(i)).join('')}</div>
    <button class="btn-add-choice" onclick="addChoiceRowModal()"><i class="ti ti-plus"></i> Add another choice</button>

    <div class="sep"></div>
    <div class="form-row" style="align-items:end">
      <div class="form-group">
        <label>Active choice # (current round)</label>
        <input type="number" id="m_choiceIdx" value="${def.currentChoiceIdx+1}" min="1" style="width:80px">
      </div>
    </div>
    <div class="form-group"><label>Remarks</label><textarea id="m_remarks">${escHtml(def.remarks)}</textarea></div>

    <div class="modal-footer">
      ${isEdit?`<button class="btn btn-danger btn-sm" onclick="deleteStudent('${escHtml(def.id)}');closeModal()"><i class="ti ti-trash"></i> Delete</button>`:''}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStudent('${escHtml(isEdit?def.id:'')}')"><i class="ti ti-check"></i> ${isEdit?'Save changes':'Add student'}</button>
    </div>
  </div></div>`;

  document.body.insertAdjacentHTML('beforeend', html);
}

function addChoiceRowModal() {
  const list = document.getElementById('choicesList');
  const i = list.children.length;
  list.insertAdjacentHTML('beforeend',
    `<div class="choice-row" id="cr_${i}">
      <span class="choice-num">${i+1}.</span>
      <span style="width:6px"></span>
      <select id="choice_${i}">
        <option value="">— none —</option>
        ${state.companies.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}
      </select>
      <button class="company-rm" onclick="this.closest('.choice-row').remove()" title="Remove">×</button>
    </div>`
  );
}

function saveStudent(oldId) {
  const id = (document.getElementById('m_id').value||'').trim();
  const name = (document.getElementById('m_name').value||'').trim();
  const date = document.getElementById('m_date').value;
  const time = document.getElementById('m_time').value;
  const remarks = (document.getElementById('m_remarks').value||'').trim();
  const choiceIdxRaw = parseInt(document.getElementById('m_choiceIdx').value)||1;

  if (!id) { toast('Student ID is required.','error'); return; }
  if (!name) { toast('Name is required.','error'); return; }

  const choices = [];
  let i = 0;
  while (document.getElementById(`choice_${i}`)) {
    const v = document.getElementById(`choice_${i}`).value;
    if (v) choices.push(v);
    i++;
  }

  const existing = state.students.find(s=>s.id===oldId);
  const student = {
    id, name,
    slot: date ? `${date}${time?' '+time:''}` : '',
    choices: choices.length ? choices : [''],
    currentChoiceIdx: Math.max(0, Math.min(choiceIdxRaw-1, Math.max(choices.length-1,0))),
    rounds: existing ? existing.rounds : [],
    remarks
  };

  if (oldId) {
    const idx = state.students.findIndex(s=>s.id===oldId);
    if (idx >= 0) state.students[idx] = student;
    else state.students.push(student);
  } else {
    if (state.students.find(s=>s.id===id)) { toast('Student ID already exists.','error'); return; }
    state.students.push(student);
  }

  closeModal();
  updateBadges();
  renderContent();
  toast(`${name} ${oldId?'updated':'added'} successfully.`, 'success');
}

// ═══════════════════════════════════════════════════════════════════════════════
// ADD ROUND MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function openAddRound(id) {
  const s = state.students.find(st=>st.id===id);
  if (!s) return;
  const rNum = s.rounds.length + 1;
  const company = getCurrentCompany(s);

  const html = `<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target.id==='modalBackdrop')closeModal()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:420px">
    <div class="modal-header">
      <div class="modal-title">Round ${rNum} result — ${escHtml(s.name)}</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">
      Interviewing at: <strong>${escHtml(company)}</strong>
      ${s.choices.length > s.currentChoiceIdx+1 ? `<br><span style="color:var(--amber)">Next choice if failed: ${escHtml(s.choices[s.currentChoiceIdx+1])}</span>` : '<br><span style="color:var(--red-text)">No more choices — failure = withdrawn</span>'}
    </p>
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" id="r_date"></div>
      <div class="form-group"><label>Outcome *</label>
        <select id="r_status">
          <option value="scheduled">Scheduled (pending)</option>
          <option value="pass">Pass ✓</option>
          <option value="fail">Fail ✗</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Notes / remarks</label><textarea id="r_notes" placeholder="Optional…"></textarea></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveRound('${escHtml(id)}')"><i class="ti ti-check"></i> Save round</button>
    </div>
  </div></div>`;

  document.body.insertAdjacentHTML('beforeend', html);
}

function saveRound(id) {
  const s = state.students.find(st=>st.id===id);
  if (!s) return;
  const status = document.getElementById('r_status').value;
  const date = document.getElementById('r_date').value;
  const notes = (document.getElementById('r_notes').value||'').trim();

  s.rounds.push({ status, date, notes });

  if (status === 'fail') {
    if (s.currentChoiceIdx + 1 < s.choices.length) {
      s.currentChoiceIdx++;
      toast(`${s.name} failed. Advanced to choice #${s.currentChoiceIdx+1}: ${s.choices[s.currentChoiceIdx]}`, 'info');
    } else {
      toast(`${s.name} has no more choices remaining — marked as withdrawn.`, 'error');
    }
  } else if (status === 'pass') {
    if (isSuccessful(s)) {
      toast(`🎉 ${s.name} has successfully completed all rounds at ${getCurrentCompany(s)}!`, 'success');
    } else {
      toast(`Round ${s.rounds.length} recorded. ${s.name} passed.`, 'success');
    }
  } else {
    toast(`Round ${s.rounds.length} scheduled for ${s.name}.`, 'info');
  }

  closeModal();
  updateBadges();
  renderContent();
}

// ═══════════════════════════════════════════════════════════════════════════════
// DELETE
// ═══════════════════════════════════════════════════════════════════════════════
function deleteStudent(id) {
  const s = state.students.find(st=>st.id===id);
  if (!s) return;
  if (!confirm(`Delete ${s.name} (${s.id})? This cannot be undone.`)) return;
  state.students = state.students.filter(st=>st.id!==id);
  updateBadges();
  renderContent();
  toast(`${s.name} deleted.`, 'info');
}

// ═══════════════════════════════════════════════════════════════════════════════
// COMPANY MANAGEMENT
// ═══════════════════════════════════════════════════════════════════════════════
function addCompany() {
  const inp = document.getElementById('newCompanyInput');
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) return;
  if (state.companies.includes(name)) { toast('Company already exists.','error'); return; }
  state.companies.push(name);
  inp.value = '';
  renderContent();
  toast(`"${name}" added to company list.`, 'success');
}

function removeCompany(i) {
  const co = state.companies[i];
  if (!confirm(`Remove "${co}" from the company list?`)) return;
  state.companies.splice(i, 1);
  renderContent();
  toast(`"${co}" removed.`, 'info');
}

// ═══════════════════════════════════════════════════════════════════════════════
// GOOGLE SHEETS
// ═══════════════════════════════════════════════════════════════════════════════
function connectSheet() {
  const raw = document.getElementById('sheetId').value.trim();
  const match = raw.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  const id = match ? match[1] : raw;
  const apiKey = state.apiKey || (document.getElementById('s_apiKey')?document.getElementById('s_apiKey').value.trim():'');

  if (!id) { toast('Enter a Sheet ID or URL first.','error'); return; }
  if (!apiKey) { toast('Enter your Google API key in Settings first.','error'); setStatus('error','No API key'); return; }

  state.sheetId = id;
  document.getElementById('sheetId').value = id;
  setStatus('','Connecting…');

  const tab = state.sheetTab || 'Students';
  fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(tab+'!A1:Z1')}?key=${apiKey}`)
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(() => {
      state.connected = true;
      setStatus('connected','Connected');
      document.getElementById('syncBtn').disabled = false;
      toast('Connected! Loading data…','success');
      fetchSheetData(id, apiKey, tab);
    })
    .catch(err => {
      setStatus('error','Connection failed');
      toast('Could not connect: ' + err.message,'error');
    });
}

function fetchSheetData(id, apiKey, tab) {
  fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(tab+'!A:Z')}?key=${apiKey}`)
    .then(r=>r.json())
    .then(data=>{
      if (!data.values || data.values.length < 2) { toast('Sheet connected but appears empty.','info'); return; }
      const [headers,...rows] = data.values;
      const get = (row,k) => { const i=headers.indexOf(k); return i>=0?(row[i]||''):''; };
      const students = rows.map(row=>{
        const choices=[];
        let ci=0;
        while(headers.includes(`Choice${ci+1}`)){ const v=get(row,`Choice${ci+1}`); if(v) choices.push(v); ci++; }
        let rounds=[];
        try{ rounds=JSON.parse(get(row,'Rounds')||'[]'); }catch(e){}
        return { id:get(row,'ID'), name:get(row,'Name'), slot:get(row,'Slot'), choices, currentChoiceIdx:parseInt(get(row,'CurrentChoiceIdx'))||0, rounds, remarks:get(row,'Remarks') };
      }).filter(s=>s.id&&s.name);
      state.students = students;
      updateBadges(); renderContent();
      toast(`Loaded ${students.length} students from Google Sheets.`,'success');
    })
    .catch(err=>{ toast('Error reading sheet: '+err.message,'error'); });
}

function syncSheet() {
  if (!state.connected) { toast('Connect to Google Sheets first.','error'); return; }
  toast('Write-back requires OAuth 2.0 credentials. Use "Export CSV" as a backup, or manually paste data into your sheet.','info');
}

function setStatus(cls,label) {
  document.getElementById('statusDot').className = 'status-dot' + (cls?' '+cls:'');
  document.getElementById('statusLabel').textContent = label;
}

// ═══════════════════════════════════════════════════════════════════════════════
// CSV IMPORT / EXPORT
// ═══════════════════════════════════════════════════════════════════════════════
function exportCSV() {
  const maxC = Math.max(...state.students.map(s=>s.choices.length), 3);
  const headers = ['ID','Name','Class','Slot',...Array.from({length:maxC},(_,i)=>`Choice${i+1}`),'CurrentChoiceIdx','Rounds','Remarks'];
  const rows = state.students.map(s=>[
    s.id, s.name, s.cls||'', s.slot,
    ...Array.from({length:maxC},(_,i)=>s.choices[i]||''),
    s.currentChoiceIdx,
    JSON.stringify(s.rounds),
    s.remarks
  ].map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `interview_scheduler_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('CSV exported successfully.','success');
}

// ── Excel import (your Combined_Choices.xlsx format) ──────────────────────────
function importExcel(input) {
  const file = input.files[0];
  if (!file) return;

  // Dynamically load SheetJS if not already loaded
  function doRead() {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});

        if (!rows.length) { toast('Excel file appears empty.','error'); return; }

        // Detect column names (case-insensitive, trim spaces)
        const sampleRow = rows[0];
        const keys = Object.keys(sampleRow);
        function findCol(...names) {
          for (const n of names) {
            const found = keys.find(k => k.trim().toLowerCase() === n.toLowerCase());
            if (found) return found;
          }
          return null;
        }

        const colIndex    = findCol('Index','index','No','no','#');
        const colClass    = findCol('Class','class','Group','group');
        const colName     = findCol('Fullname','fullname','Full Name','full name','Name','name','Student Name');
        const colChoice1  = findCol('1st choice','1st Choice','Choice1','choice1','First Choice');
        const colChoice2  = findCol('2nd choice','2nd Choice','Choice2','choice2','Second Choice');
        const colChoice3  = findCol('3rd choice','3rd Choice','Choice3','choice3','Third Choice');

        if (!colName) { toast('Cannot find a Name column in this Excel file.','error'); return; }

        const students = rows.map(row => {
          const idx   = colIndex ? String(row[colIndex]).trim() : '';
          const cls   = colClass ? String(row[colClass]).trim() : '';
          const name  = colName  ? String(row[colName]).trim()  : '';
          const id    = idx && cls ? `${idx}-${cls}` : idx || name.slice(0,8).replace(/\s/g,'');
          const choices = [];
          if (colChoice1 && row[colChoice1]) choices.push(String(row[colChoice1]).trim());
          if (colChoice2 && row[colChoice2]) choices.push(String(row[colChoice2]).trim());
          if (colChoice3 && row[colChoice3]) choices.push(String(row[colChoice3]).trim());

          // Collect any Choice4, Choice5... columns dynamically
          let ci = 4;
          while (true) {
            const k = findCol(`${ci}th choice`,`Choice${ci}`,`choice${ci}`);
            if (!k || !row[k]) break;
            choices.push(String(row[k]).trim());
            ci++;
          }

          return { id, name, cls, slot:'', choices: choices.length ? choices : [''], currentChoiceIdx:0, rounds:[], remarks:'' };
        }).filter(s => s.name);

        // Auto-add any new companies found in the choices
        students.forEach(s => {
          s.choices.forEach(c => {
            if (c && !state.companies.includes(c)) state.companies.push(c);
          });
        });

        if (!confirm(`Import ${students.length} students from "${file.name}"?\n\nThis will replace all current student data.`)) return;
        state.students = students;
        updateBadges(); renderContent();
        toast(`Imported ${students.length} students successfully.`, 'success');
      } catch(err) {
        toast('Excel import failed: ' + err.message, 'error');
        console.error(err);
      }
    };
    reader.readAsArrayBuffer(file);
    input.value = '';
  }

  if (typeof XLSX !== 'undefined') {
    doRead();
  } else {
    toast('Loading Excel library…', 'info');
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    script.onload = doRead;
    script.onerror = () => toast('Failed to load Excel library. Check your internet connection.', 'error');
    document.head.appendChild(script);
  }
}

// ── CSV import (backup format) ────────────────────────────────────────────────
function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
      if (lines.length < 2) { toast('CSV appears empty.','error'); return; }
      const headers = parseCSVRow(lines[0]);
      const students = [];
      for (let i=1;i<lines.length;i++) {
        const vals = parseCSVRow(lines[i]);
        const get = k => { const idx=headers.indexOf(k); return idx>=0?(vals[idx]||'').trim():''; };
        const choices=[];
        let ci=0;
        while(headers.includes(`Choice${ci+1}`)){ const v=get(`Choice${ci+1}`); if(v) choices.push(v); ci++; }
        let rounds=[];
        try{ rounds=JSON.parse(get('Rounds')||'[]'); }catch(e){}
        const s={id:get('ID'),name:get('Name'),cls:get('Class'),slot:get('Slot'),choices,currentChoiceIdx:parseInt(get('CurrentChoiceIdx'))||0,rounds,remarks:get('Remarks')};
        if(s.id&&s.name) students.push(s);
      }
      if (!confirm(`Import ${students.length} students? This will replace all current data.`)) return;
      state.students = students;
      updateBadges(); renderContent();
      toast(`Imported ${students.length} students.`,'success');
    } catch(err) { toast('Import failed: '+err.message,'error'); }
  };
  reader.readAsText(file);
  input.value='';
}

function parseCSVRow(row) {
  const result=[];
  let inQ=false,cur='';
  for(let i=0;i<row.length;i++){
    const ch=row[i];
    if(ch==='"'){
      if(inQ&&row[i+1]==='"'){cur+='"';i++;}
      else inQ=!inQ;
    } else if(ch===','&&!inQ){
      result.push(cur); cur=''; 
    } else cur+=ch;
  }
  result.push(cur);
  return result;
}

// ═══════════════════════════════════════════════════════════════════════════════
// MODAL / TOAST HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
function closeModal() {
  const b = document.getElementById('modalBackdrop');
  if (b) b.remove();
}

function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.remove('show'), 3800);
}

// Keyboard: Escape closes modal
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
